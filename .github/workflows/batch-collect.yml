name: Batch Price Collection

on:
  schedule:
    # 毎日 JST 9:00 (UTC 0:00) と JST 21:00 (UTC 12:00) に実行
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger batch pipeline
        env:
          APP_URL: https://claude-repositry-1-gpu-research-app.vercel.app
          BATCH_SECRET: ${{ secrets.BATCH_API_SECRET }}
        run: |
          echo "Calling: ${APP_URL}/api/batch"
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${APP_URL}/api/batch" \
            -H "Content-Type: application/json" \
            -H "x-api-secret: ${BATCH_SECRET}")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" != "200" ]; then
            echo "::error::Batch pipeline failed with status $http_code"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Batch Collection Result" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
